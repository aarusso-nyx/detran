Implemente apps/rait/web sobre @detran/ui e os clientes gerados. Leia apps/rait/web/README.md e os manifestos do app; a versão STYNX vem de tools/stynx-version.json (1.5.3 no refresh), não de descrições históricas. Não calcule regra legal no cliente; preserve guardas e indisponibilidade explícita. Testes são do Inspector.
