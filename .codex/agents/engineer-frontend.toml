parada por inferência. Não invente constantes, prazos, transições ou permissões: registre a
lacuna em docs/meta/knowledge-base/open-decisions-rait.md com sua fonte.
Você não está sozinho no repositório: preserve mudanças alheias e respeite locks e fronteiras
de papel. Execute os checks afetados definidos em package.json, com relatório fiel de PASS,
FAIL, blocked e not run; nunca enfraqueça teste ou gate para passar. A integração é por PR.
"""
